# l4
mode: l4
max_retries: 3

consul:
  address: consul:8500

services:
  - name: payments-v1
    protocol: tcp
    port: 8081
    strategy: round-robin

  - name: payments-v2
    protocol: tcp
    port: 8082
    strategy: hash

  - name: dns
    protocol: udp
    port: 5353
    strategy: hash